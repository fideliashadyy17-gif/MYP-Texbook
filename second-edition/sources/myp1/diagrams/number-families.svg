<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-labelledby="title desc"><title id="title">Nested number families</title><desc id="desc">Natural numbers sit inside whole numbers, which sit inside integers, which sit inside rational numbers. Zero is whole but not natural in this book. Negative integers are outside the whole numbers. Fractions such as three quarters and decimals such as 2.5 are rational.</desc><rect x="30" y="18" width="620" height="150" rx="16" fill="#eef3f4" stroke="#38566e"/><text x="52" y="44" font-size="16" fill="#38566e" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Rational numbers</text><rect x="70" y="58" width="540" height="94" rx="14" fill="#f5eee2" stroke="#d7a55d"/><text x="90" y="84" font-size="15" fill="#182c2a" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Integers</text><rect x="110" y="96" width="460" height="44" rx="12" fill="#fbf6ec" stroke="#e7ddca"/><text x="130" y="124" font-size="14" fill="#182c2a" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Whole numbers</text><rect x="300" y="101" width="250" height="34" rx="10" fill="#ffffff" stroke="#b24f32"/><text x="320" y="124" font-size="13" fill="#b24f32" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Natural numbers: 1, 2, 3, …</text><text x="40" y="124" font-size="15" fill="#182c2a" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">−3</text><text x="150" y="124" font-size="15" fill="#182c2a" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">0</text><text x="590" y="44" font-size="14" fill="#38566e" text-anchor="end" font-weight="700" font-family="Inter, Arial, sans-serif">2.5, 3/4</text></svg>