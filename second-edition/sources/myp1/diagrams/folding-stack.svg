<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 228" role="img" aria-labelledby="title desc"><title id="title">Doubling layers in an ideal folding model</title><desc id="desc">Bars show 1, 2, 4 and 8 layers after 0, 1, 2 and 3 folds. For a sheet 0.1 millimetres thick, the modelled thicknesses are 0.1, 0.2, 0.4 and 0.8 millimetres. Later fold counts are left for the investigation.</desc><rect x="18" y="16" width="644" height="180" rx="12" fill="#ffffff" stroke="#e7ddca"/><rect x="92" y="150" width="56" height="8" rx="3" fill="#38566e" stroke="none"/><text x="120" y="178" font-size="13" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">n=0</text><text x="120" y="140" font-size="13" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">1 layer</text><text x="120" y="198" font-size="12" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">0.1 mm</text><rect x="232" y="142" width="56" height="16" rx="3" fill="#d7a55d" stroke="none"/><text x="260" y="178" font-size="13" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">n=1</text><text x="260" y="132" font-size="13" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">2 layers</text><text x="260" y="198" font-size="12" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">0.2 mm</text><rect x="372" y="126" width="56" height="32" rx="3" fill="#38566e" stroke="none"/><text x="400" y="178" font-size="13" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">n=2</text><text x="400" y="116" font-size="13" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">4 layers</text><text x="400" y="198" font-size="12" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">0.4 mm</text><rect x="512" y="94" width="56" height="64" rx="3" fill="#d7a55d" stroke="none"/><text x="540" y="178" font-size="13" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">n=3</text><text x="540" y="84" font-size="13" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">8 layers</text><text x="540" y="198" font-size="12" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">0.8 mm</text><text x="340" y="38" font-size="14" fill="#b24f32" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Ideal model: each fold doubles the layers</text><text x="340" y="212" font-size="12" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">The first four stages are shown. Bar height represents layers, not paper width.</text></svg>