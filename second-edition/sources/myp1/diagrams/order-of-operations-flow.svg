<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-labelledby="title desc"><title id="title">Order of operations flow</title><desc id="desc">To evaluate 7 plus 2 times 3 squared, first square 3 to get 9, then multiply 2 by 9 to get 18, then add 7 to get 25.</desc><rect x="18" y="16" width="644" height="164" rx="12" fill="#ffffff" stroke="#e7ddca"/><text x="340" y="46" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">7 + 2 × 3²</text><rect x="22" y="72" width="176" height="62" rx="8" fill="#eef3f4" stroke="#38566e"/><text x="110" y="98" font-size="17" fill="#182c2a" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">3² = 9</text><text x="110" y="121" font-size="12" fill="#38566e" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">indices first</text><rect x="252" y="72" width="176" height="62" rx="8" fill="#eef3f4" stroke="#38566e"/><text x="340" y="98" font-size="17" fill="#182c2a" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">2 × 9 = 18</text><text x="340" y="121" font-size="12" fill="#38566e" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">then multiply</text><rect x="482" y="72" width="176" height="62" rx="8" fill="#eef3f4" stroke="#38566e"/><text x="570" y="98" font-size="17" fill="#182c2a" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">7 + 18 = 25</text><text x="570" y="121" font-size="12" fill="#38566e" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">then add</text><line x1="198" y1="103" x2="252" y2="103" stroke="#b24f32" stroke-width="2"/><path d="M252 103 l-9 -5 v10 z" fill="#b24f32"/><line x1="428" y1="103" x2="482" y2="103" stroke="#b24f32" stroke-width="2"/><path d="M482 103 l-9 -5 v10 z" fill="#b24f32"/><text x="340" y="161" font-size="12.5" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">Brackets would change the order; without them, powers before multiplication before addition.</text></svg>