<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img"><rect x="40" y="30" width="640" height="240" rx="8" fill="#fbf6ec" stroke="#0d2a28" stroke-width="1.5"/><text x="52" y="50" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0d2a28" text-anchor="start" font-weight="600">Real numbers (R)</text><rect x="70" y="65" width="440" height="185" rx="8" fill="#fff" stroke="#e7ddca" stroke-width="1.5"/><text x="82" y="85" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0d2a28" text-anchor="start" font-weight="600">Rational numbers (Q)</text><rect x="100" y="100" width="380" height="130" rx="8" fill="#fff" stroke="#e7ddca" stroke-width="1.5"/><text x="112" y="120" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0d2a28" text-anchor="start" font-weight="600">Integers (Z)</text><rect x="130" y="135" width="320" height="75" rx="8" fill="#fff" stroke="#e7ddca" stroke-width="1.5"/><text x="142" y="155" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0d2a28" text-anchor="start" font-weight="600">Whole numbers</text><rect x="160" y="165" width="260" height="35" rx="8" fill="#fff" stroke="#d7a55d" stroke-width="1.5"/><text x="172" y="185" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0d2a28" text-anchor="start" font-weight="600">Natural numbers (N)</text><text x="575" y="130" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b24f32" text-anchor="middle" font-weight="700">Irrationals</text><text x="575" y="155" font-family="Inter,Arial,sans-serif" font-size="14" fill="#b24f32" text-anchor="middle" font-weight="400">√2, π</text><text x="575" y="180" font-family="Inter,Arial,sans-serif" font-size="12" fill="#b24f32" text-anchor="middle" font-weight="400">(real, not rational)</text></svg>