<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 145" role="img" aria-labelledby="title desc"><title id="title">Rounding with a carry</title><desc id="desc">39.95 is halfway between 39.9 and 40.0. Under the usual convention, a 5 in the next place rounds up to 40.0.</desc><line x1="70" y1="80" x2="610" y2="80" stroke="#182c2a" stroke-width="2.5" /><line x1="70" y1="70" x2="70" y2="90" stroke="#182c2a" stroke-width="2" /><text x="70" y="116" font-size="16" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">39.9</text><line x1="340.000000000023" y1="70" x2="340.000000000023" y2="90" stroke="#182c2a" stroke-width="2" /><text x="340.000000000023" y="116" font-size="16" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">39.95</text><line x1="610.0000000000077" y1="70" x2="610.0000000000077" y2="90" stroke="#182c2a" stroke-width="2" /><text x="610.0000000000077" y="116" font-size="16" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">40.0</text><circle cx="340.000000000023" cy="80" r="7" fill="#b24f32"/><text x="340.000000000023" y="48" font-size="15" fill="#b24f32" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">halfway</text><path d="M 352.000000000023 62 Q 590.0000000000077 34 606.0000000000077 66" fill="none" stroke="#b24f32" stroke-width="2"/><path d="M 606.0000000000077 66 l -10 -3 l 5 9 z" fill="#b24f32"/></svg>