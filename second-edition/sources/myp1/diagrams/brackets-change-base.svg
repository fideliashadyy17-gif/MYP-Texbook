<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 178" role="img" aria-labelledby="title desc"><title id="title">Brackets change the base of a power</title><desc id="desc">When x is 4, 3 x squared is 48 because only x is squared. The quantity 3 x, all squared, is 144 because brackets include the factor 3 in the base.</desc><rect x="18" y="16" width="644" height="150" rx="12" fill="#ffffff" stroke="#e7ddca"/><rect x="42" y="42" width="270" height="96" rx="8" fill="#e7ddca" stroke="none"/><rect x="368" y="42" width="270" height="96" rx="8" fill="#eef3f4" stroke="none"/><text x="177" y="70" font-size="17" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">3x² when x = 4</text><text x="177" y="100" font-size="16" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">3 × 4² = 3 × 16 = 48</text><text x="503" y="70" font-size="17" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">(3x)² when x = 4</text><text x="503" y="100" font-size="16" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">(3 × 4)² = 12² = 144</text><text x="177" y="124" font-size="12.5" fill="#b24f32" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">Only x is squared.</text><text x="503" y="124" font-size="12.5" fill="#38566e" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">The whole product 3x is squared.</text></svg>