<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 175" role="img" aria-labelledby="title desc"><title id="title">Digit cards</title><desc id="desc">Four cards show 0, 2, 5 and 8. They are used to build four-digit numbers without repeating a digit.</desc><rect x="110" y="24" width="86" height="104" rx="10" fill="#f5eee2" stroke="#d7a55d" stroke-width="2"/><text x="153" y="94" font-size="44" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">0</text><rect x="230" y="24" width="86" height="104" rx="10" fill="#fbf6ec" stroke="#e7ddca" stroke-width="2"/><text x="273" y="94" font-size="44" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">2</text><rect x="350" y="24" width="86" height="104" rx="10" fill="#fbf6ec" stroke="#e7ddca" stroke-width="2"/><text x="393" y="94" font-size="44" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">5</text><rect x="470" y="24" width="86" height="104" rx="10" fill="#fbf6ec" stroke="#e7ddca" stroke-width="2"/><text x="513" y="94" font-size="44" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">8</text><text x="340" y="154" font-size="14" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">Use each card once. A four-digit number cannot begin with 0.</text></svg>