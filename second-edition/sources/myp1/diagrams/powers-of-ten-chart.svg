<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 164" role="img" aria-labelledby="title desc"><title id="title">Place values as powers of ten</title><desc id="desc">Columns from millions to ones are labelled 10 to the sixth down to 10 to the zero, with values 1,000,000 down to 1.</desc><rect x="18" y="24" width="92" height="92" rx="0" fill="#eef3f4" stroke="#e7ddca"/><text x="64" y="44" font-size="10.5" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Millions</text><text x="64" y="74" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">10⁶</text><text x="64" y="100" font-size="11" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">1,000,000</text><rect x="110" y="24" width="92" height="92" rx="0" fill="#f5eee2" stroke="#e7ddca"/><text x="156" y="44" font-size="10.5" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Hundred thousands</text><text x="156" y="74" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">10⁵</text><text x="156" y="100" font-size="11" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">100,000</text><rect x="202" y="24" width="92" height="92" rx="0" fill="#eef3f4" stroke="#e7ddca"/><text x="248" y="44" font-size="10.5" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Ten thousands</text><text x="248" y="74" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">10⁴</text><text x="248" y="100" font-size="11" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">10,000</text><rect x="294" y="24" width="92" height="92" rx="0" fill="#f5eee2" stroke="#e7ddca"/><text x="340" y="44" font-size="10.5" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Thousands</text><text x="340" y="74" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">10³</text><text x="340" y="100" font-size="11" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">1,000</text><rect x="386" y="24" width="92" height="92" rx="0" fill="#eef3f4" stroke="#e7ddca"/><text x="432" y="44" font-size="10.5" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Hundreds</text><text x="432" y="74" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">10²</text><text x="432" y="100" font-size="11" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">100</text><rect x="478" y="24" width="92" height="92" rx="0" fill="#f5eee2" stroke="#e7ddca"/><text x="524" y="44" font-size="10.5" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Tens</text><text x="524" y="74" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">10¹</text><text x="524" y="100" font-size="11" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">10</text><rect x="570" y="24" width="92" height="92" rx="0" fill="#eef3f4" stroke="#e7ddca"/><text x="616" y="44" font-size="10.5" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Ones</text><text x="616" y="74" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">10⁰</text><text x="616" y="100" font-size="11" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">1</text><text x="340" y="146" font-size="13" fill="#b24f32" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">Each step left multiplies by 10; each step right divides by 10.</text></svg>