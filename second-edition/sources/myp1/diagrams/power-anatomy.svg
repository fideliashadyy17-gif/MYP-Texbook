<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 186" role="img" aria-labelledby="title desc"><title id="title">Anatomy of a power</title><desc id="desc">In 3 to the fourth power, 3 is the base and 4 is the exponent. The expanded product is 3 times 3 times 3 times 3, which equals 81.</desc><rect x="20" y="18" width="640" height="150" rx="12" fill="#ffffff" stroke="#e7ddca"/><text x="95" y="92" font-size="54" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">3</text><text x="128" y="58" font-size="28" fill="#b24f32" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">4</text><line x1="122" y1="64" x2="170" y2="44" stroke="#b24f32" stroke-width="1.5"/><text x="235" y="40" font-size="14" fill="#b24f32" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">exponent: 4 factors</text><line x1="92" y1="100" x2="150" y2="126" stroke="#38566e" stroke-width="1.5"/><text x="225" y="136" font-size="14" fill="#38566e" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">base: repeated factor 3</text><text x="390" y="88" font-size="22" fill="#182c2a" text-anchor="middle" font-weight="600" font-family="Inter, Arial, sans-serif">3 × 3 × 3 × 3</text><text x="560" y="88" font-size="22" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">= 81</text><text x="420" y="154" font-size="12.5" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">The exponent counts factors; it is not a multiplier.</text></svg>