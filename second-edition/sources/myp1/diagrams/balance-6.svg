<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img"><text x="360" y="24" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0d2a28" text-anchor="middle" font-weight="700">Keep both sides balanced</text><line x1="180" y1="80" x2="540" y2="80" stroke="#0d2a28" stroke-width="3" /><line x1="360" y1="80" x2="360" y2="150" stroke="#0d2a28" stroke-width="3" /><path d="M300 150 L420 150 L390 180 L330 180 Z" fill="#f5eee2" stroke="#d7a55d" stroke-width="2" /><rect x="140" y="40" width="160" height="40" rx="6" fill="#eef3f4" stroke="#38566e" stroke-width="1.5"/><text x="220" y="66" font-family="Inter,Arial,sans-serif" font-size="18" fill="#182c2a" text-anchor="middle" font-weight="700">3n + 5</text><rect x="420" y="40" width="160" height="40" rx="6" fill="#eef3f4" stroke="#38566e" stroke-width="1.5"/><text x="500" y="66" font-family="Inter,Arial,sans-serif" font-size="18" fill="#182c2a" text-anchor="middle" font-weight="700">20</text><text x="360" y="220" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b24f32" text-anchor="middle" font-weight="400">Subtract 5 from both sides, then divide both sides by 3.</text></svg>