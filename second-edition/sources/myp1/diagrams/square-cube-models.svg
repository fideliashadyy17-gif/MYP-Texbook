<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" role="img" aria-labelledby="title desc"><title id="title">Square and cube models</title><desc id="desc">A 4 by 4 square contains 16 unit squares. A cube with edge 4 contains 4 layers of 16 unit cubes, so 4 cubed is 64.</desc><rect x="18" y="16" width="644" height="224" rx="12" fill="#ffffff" stroke="#e7ddca"/><rect x="58" y="52" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><rect x="86" y="52" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="114" y="52" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><rect x="142" y="52" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="58" y="80" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="86" y="80" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><rect x="114" y="80" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="142" y="80" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><rect x="58" y="108" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><rect x="86" y="108" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="114" y="108" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><rect x="142" y="108" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="58" y="136" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="86" y="136" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><rect x="114" y="136" width="28" height="28" rx="0" fill="#f5eee2" stroke="#d7a55d"/><rect x="142" y="136" width="28" height="28" rx="0" fill="#fbf6ec" stroke="#d7a55d"/><text x="114" y="190" font-size="15" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">4 × 4 = 4² = 16</text><text x="114" y="38" font-size="13" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">square: 16 unit squares</text><polygon points="386,68 482,68 530,20 434,20" fill="#eef3f4" stroke="#38566e"/><polygon points="482,164 530,116 530,20 482,68" fill="#dfe8ec" stroke="#38566e"/><polygon points="386,164 482,164 482,68 386,68" fill="#f5eee2" stroke="#38566e"/><line x1="410" y1="164" x2="410" y2="68" stroke="#38566e" stroke-width="1"/><line x1="386" y1="140" x2="482" y2="140" stroke="#38566e" stroke-width="1"/><line x1="410" y1="68" x2="458" y2="20" stroke="#38566e" stroke-width="1"/><line x1="398" y1="56" x2="494" y2="56" stroke="#38566e" stroke-width="0.8"/><line x1="494" y1="56" x2="494" y2="152" stroke="#38566e" stroke-width="0.8"/><line x1="482" y1="140" x2="530" y2="92" stroke="#38566e" stroke-width="1"/><line x1="434" y1="164" x2="434" y2="68" stroke="#38566e" stroke-width="1"/><line x1="386" y1="116" x2="482" y2="116" stroke="#38566e" stroke-width="1"/><line x1="434" y1="68" x2="482" y2="20" stroke="#38566e" stroke-width="1"/><line x1="410" y1="44" x2="506" y2="44" stroke="#38566e" stroke-width="0.8"/><line x1="506" y1="44" x2="506" y2="140" stroke="#38566e" stroke-width="0.8"/><line x1="482" y1="116" x2="530" y2="68" stroke="#38566e" stroke-width="1"/><line x1="458" y1="164" x2="458" y2="68" stroke="#38566e" stroke-width="1"/><line x1="386" y1="92" x2="482" y2="92" stroke="#38566e" stroke-width="1"/><line x1="458" y1="68" x2="506" y2="20" stroke="#38566e" stroke-width="1"/><line x1="422" y1="32" x2="518" y2="32" stroke="#38566e" stroke-width="0.8"/><line x1="518" y1="32" x2="518" y2="128" stroke="#38566e" stroke-width="0.8"/><line x1="482" y1="92" x2="530" y2="44" stroke="#38566e" stroke-width="1"/><text x="470" y="206" font-size="15" fill="#0d2a28" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">4 × 4 × 4 = 4³ = 64</text><text x="470" y="228" font-size="13" fill="#182c2a" text-anchor="middle" font-weight="500" font-family="Inter, Arial, sans-serif">cube: 64 unit cubes</text></svg>